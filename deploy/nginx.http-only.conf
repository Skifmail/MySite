# Только HTTP — для первого деплоя до certbot.
# После: certbot --nginx -d aleks-shataylo.ru -d www.aleks-shataylo.ru
# замените конфиг на deploy/nginx.conf (полный вариант с SSL и редиректом www).

server {
    listen 80;
    server_name aleks-shataylo.ru www.aleks-shataylo.ru;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
