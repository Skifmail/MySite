# Полный пример для продакшена: HTTPS + редирект www → без www.
# Пути к сертификатам проверьте: ls /etc/letsencrypt/live/
# После правок: sudo nginx -t && sudo systemctl reload nginx

# --- HTTP: www → сразу на канонический HTTPS без www ---
server {
    listen 80;
    server_name www.aleks-shataylo.ru;
    return 301 https://aleks-shataylo.ru$request_uri;
}

# --- HTTP: основной домен → HTTPS без www ---
server {
    listen 80;
    server_name aleks-shataylo.ru;
    return 301 https://aleks-shataylo.ru$request_uri;
}

# --- HTTPS: www → канонический URL без www ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.aleks-shataylo.ru;

    ssl_certificate     /etc/letsencrypt/live/aleks-shataylo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aleks-shataylo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aleks-shataylo.ru$request_uri;
}

# --- HTTPS: основной сайт (прокси на приложение) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aleks-shataylo.ru;

    ssl_certificate     /etc/letsencrypt/live/aleks-shataylo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aleks-shataylo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
