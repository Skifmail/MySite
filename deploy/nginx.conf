# Редирект www → основной домен без www (один канонический URL для SEO).
# После certbot проверьте, что для порта 443 есть такой же редирект для www
# (certbot может добавить свой блок — при необходимости объедините вручную).
server {
    listen 80;
    server_name www.aleks-shataylo.ru;
    return 301 https://aleks-shataylo.ru$request_uri;
}

server {
    listen 80;
    server_name aleks-shataylo.ru;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
